name: Release build cache

# Release runs start from a tag, and a tag can only restore caches saved on
# main. Without this workflow every release compiled all dependencies cold,
# twice per architecture. This builds both release variants on main, unbundled
# and unsigned, so release.yml's build-installers legs restore a warm cache.
on:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.lock
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
      - src-tauri/tauri.store.conf.json
      - .github/workflows/release-cache.yml
  # GitHub evicts a cache nobody has read for 7 days. Releases can be further
  # apart than that, so touch the cache weekly; an exact hit skips the build.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warm:
    name: Warm ${{ matrix.arch }} release cache
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Same toolchain step as release.yml's build-installers, so the cache's
      # rustc hash matches.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      # Must match release.yml's build-installers rust-cache shared-key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: cache
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.target }}
          cache-bin: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      # `tauri build` rather than `cargo build`: it sets the same features and
      # config as the release build, so the cached artifacts are reused there.
      # --no-bundle skips the installer and its signCommand.
      - name: Build the regular app
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm tauri build --ci --no-bundle --target ${{ matrix.target }}

      - name: Build the Store app
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm tauri build --ci --no-bundle --target ${{ matrix.target }} --features app-store --config src-tauri/tauri.store.conf.json
